[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "rank_preserving_calibration"
version = "0.9.0"
description = "Rank-preserving calibration of multiclass probabilities via Dykstra's projections and ADMM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Gaurav Sood", email = "contact@gsood.com" },
]
keywords = ["calibration", "machine learning", "multiclass", "isotonic", "dykstra", "admm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.10",
  "clarabel>=0.9",
]

[project.optional-dependencies]
performance = [
    "numba>=0.56",
]

[project.urls]
Homepage = "https://github.com/finite-sample/rank-preserving-calibration"
Source = "https://github.com/finite-sample/rank-preserving-calibration"
Issues = "https://github.com/finite-sample/rank-preserving-calibration/issues"
Documentation = "https://finite-sample.github.io/rank-preserving-calibration/"

[tool.uv.build-backend]
module-name = "rank_preserving_calibration"
module-root = ""

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6.0",
    # The strongest tests check the solvers against an independent convex
    # solver. Without cvxpy installed they skip silently, which is how the
    # cross-checks in test_qp_solver.py and test_audit_regressions.py were
    # never actually running in CI.
    "cvxpy>=1.5",
]
dev = [
    { include-group = "test" },
    "ruff==0.16.5",
    "pre-commit>=3.0",
    "numba>=0.56",
    "pydoclint>=0.3.0",
    "pyright>=1.1.0",
]
examples = ["scipy>=1.0", "matplotlib>=3.0", "jupyter", "seaborn>=0.11", "scikit-learn>=1.0", "plotly>=5.0", "pandas>=1.5"]
# myst-nb executes the notebooks under docs/source/examples during the build, so
# the docs group carries their runtime imports (sklearn, matplotlib, seaborn,
# plotly) as well as the Sphinx toolchain.
docs = [
    "sphinx>=8",
    "furo",
    "myst-nb>=1.0",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton",
    "jupyter",
    "ipykernel>=6.0",
    "scikit-learn>=1.0",
    "matplotlib>=3.0",
    "seaborn>=0.11",
    "plotly>=5.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["**/.*", "build/", "dist/", "venv/", ".venv/", "docs/source/examples/*.ipynb", "examples/", "ms/"]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = [
    "D203", "D213", "W191", "D206", "D300",
    # N803/N806: the package is a linear-algebra library and its public
    # signatures are the paper's notation -- P the N x J probability matrix, M
    # the target column sums, Q the calibrated result, R and A the KL reference
    # and anchor. Renaming them to `p`/`m`/`q` would break the API and make the
    # code unreadable against the derivations it implements.
    "N803", "N806",
]
# Greek letters that carry their mathematical meaning here: rho is the ADMM
# penalty parameter, lambda the soft-constraint weight.
allowed-confusables = ["ρ", "λ"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# N802: test names name the matrix they exercise (test_invalid_P_shape).
"tests/**" = ["S101", "D", "ARG", "SLF", "N802"]
"docs/**" = ["D"]
"rank_preserving_calibration/metrics.py" = ["E702", "RUF034"]  # Allow compact coding style with semicolons in metrics
"docs/source/examples/*.ipynb" = ["E402", "B007", "F821"]  # Allow notebook-style imports and unused loop vars

[tool.ruff.lint.isort]
known-first-party = ["rank_preserving_calibration"]

[tool.deptry]
# Exclude examples and virtual environment directories from dependency analysis
exclude = ["examples", ".venv", "venv", "env", ".git", "docs", "_build", "dist", ".*\\.egg-info"]
# Documentation dependencies are not imported in code but used for building docs
ignore_notebooks = true
# Known first-party modules that deptry might not recognize
known_first_party = ["rank_preserving_calibration"]

[tool.deptry.per_rule_ignores]
# Documentation dependencies are not imported in code but used for building docs
DEP002 = ["sphinx", "furo", "sphinx-autodoc-typehints", "sphinx-copybutton", "myst-parser", "nbsphinx", "jupyter", "ipykernel", "scikit-learn", "matplotlib", "seaborn", "plotly", "pandas"]
# Test dependencies used in tests directory
DEP004 = ["pytest", "hypothesis", "pytest-cov", "cvxpy"]

# "fro" is numpy's Frobenius-norm argument (np.linalg.norm(x, "fro")).
[tool.codespell]
ignore-words-list = "fro"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
require-return-section-when-returning-nothing = false
arg-type-hints-in-signature = true
check-yield-types = true

# The CI runs a bare `pytest --cov`; without this it would also measure tests/,
# which is always near 100% and hides the package's real number.
[tool.coverage.run]
source = ["rank_preserving_calibration"]

[tool.pytest.ini_options]
markers = [
  "slow: long-running checks, chiefly the scaling regression guard",
]
minversion = "6"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = [
    "error",
    # Both are this package's own advisories, and both are accurate.
    #
    # The KL soft solver plateaus rather than reaching tol=1e-6: on the
    # N=15, J=3, seed=42 case the final change settles near 1.4e-5 and
    # stays there from 20k iterations through 100k, so raising max_iters
    # only costs time. Worth revisiting in the solver, not by muting it.
    #
    # The feasibility advisory fires where tests deliberately build
    # matrices whose row sums cannot meet the column totals, which is
    # most of the Hypothesis-generated space. Tests that are *about*
    # that warning already assert it with pytest.warns, which sees it
    # regardless of this filter.
    "ignore:KL soft calibration did not converge:UserWarning",
    "ignore:Sum of M .* must equal:UserWarning",
]
addopts = ["--strict-config", "--strict-markers", "-ra"]

[tool.pyright]
include = ["rank_preserving_calibration"]
typeCheckingMode = "standard"
exclude = ["**/__pycache__", ".venv", "venv", "env", ".git", "docs", "_build", "dist", ".*\\.egg-info"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedFunction = false
reportUnusedVariable = true
pythonVersion = "3.12"

