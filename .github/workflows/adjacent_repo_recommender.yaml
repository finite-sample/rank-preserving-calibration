name: Find Adjacent Repositories

on:
  schedule:
    - cron: '0 5 * * 0'   # Every Sunday at 5am UTC
  workflow_dispatch:

permissions: {}

jobs:
  recommend-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Adjacent Repositories Recommender
        uses: gojiplus/adjacent@374383b176c74992693f775482df95a1122cc010 # v2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open recommendation update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/adjacent-repositories
          add-paths: README.md
          commit-message: Update adjacent repositories
          title: Update adjacent repositories
          body: Refresh repository recommendations from the scheduled adjacent scan.
          delete-branch: true
