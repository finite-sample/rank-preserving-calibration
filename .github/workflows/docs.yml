name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: gojiplus/py-canon/.github/workflows/reusable-docs.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      docs-dir: docs/source
      # 67 of the 276 docstring examples do not run: the module-level Quick
      # start prints without recording expected output, and several docstrings
      # use names they never import. They are illustrative, not executable.
      # Turn this on once they are repaired.
      run-doctests: false
      deploy: ${{ github.event_name == 'push' }}
